name: Deploy production

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: zeta-comic-generator-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out production branch
        # Pin the action to the audited v4.2.2 release.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Use the latest protected branch state so a queued older merge cannot
          # roll production back after a newer deployment.
          ref: refs/heads/master
          persist-credentials: false

      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends lftp

      - name: Upload production files
        env:
          ZCG_LIVE_SFTP_USERNAME: ${{ secrets.ZCG_LIVE_SFTP_USERNAME }}
          ZCG_LIVE_SFTP_PASSWORD: ${{ secrets.ZCG_LIVE_SFTP_PASSWORD }}
          ZCG_LIVE_SFTP_HOST: ${{ secrets.ZCG_LIVE_SFTP_HOST }}
          ZCG_LIVE_SOURCE_PATH: ${{ secrets.ZCG_LIVE_SOURCE_PATH }}
          ZCG_LIVE_REMOTE_PATH: ${{ secrets.ZCG_LIVE_REMOTE_PATH }}
          ZCG_LIVE_SFTP_PORT: ${{ secrets.ZCG_LIVE_SFTP_PORT }}
          ZCG_LIVE_HOST_FINGERPRINT: ${{ secrets.ZCG_LIVE_HOST_FINGERPRINT }}
        run: python3 .github/deploy/sftp.py
